name: Actualizar Portafolio

on:
  schedule:
    - cron: "0 13 * * 1-5"   # lunes a viernes 13:00 UTC (~9am Chile)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install playwright openpyxl
          playwright install chromium

      - name: Restaurar sesion de Asana (auth.json)
        env:
          ASANA_AUTH_PORTAFOLIO: ${{ secrets.ASANA_AUTH_PORTAFOLIO }}
        run: |
          echo "$ASANA_AUTH_PORTAFOLIO" > auth.json
          BYTES=$(wc -c < auth.json)
          echo "Tamano auth.json: $BYTES bytes"
          if [ "$BYTES" -lt 100 ]; then
            echo "::error::auth.json quedo vacio o muy chico. Revisar el secret ASANA_AUTH_PORTAFOLIO."
            exit 1
          fi

      - name: Limpiar carpeta data anterior
        run: |
          find data -maxdepth 1 -name "*.xlsx" ! -name "*fabricaci*" ! -name "*exw*" ! -name "*reporte*" -delete
          find data -maxdepth 1 -name "*.csv" -delete
          find data/servicios -name "*.xlsx" -delete 2>/dev/null || true
          find data/servicios -name "*.csv" -delete 2>/dev/null || true
          echo "Carpetas limpiadas"

      - name: Exportar proyectos y servicios desde Asana
        run: python3 scripts/asana_export_portafolio.py

      - name: Generar index.html
        run: python3 scripts/generar_portafolio.py data data/servicios index.html

      # ── PASO NUEVO ────────────────────────────────────────────────────────
      # Agrega la fecha de despacho (fase Logistica) y el pronostico de
      # termino en dias habiles de Chile. Va DESPUES de generar el HTML,
      # porque parchea el archivo que acaba de crear el generador.
      - name: Agregar despacho y pronostico
        run: |
          python3 scripts/enriquecer.py --data data --html index.html | tee enriquecer.log
          if grep -q "datos inyectados en 0/" enriquecer.log; then
            echo "::error::No se cruzo ningun proyecto entre los XLSX y el index.html"
            exit 1
          fi
          if grep -q "no esta en feriados_chile.json" enriquecer.log; then
            echo "::warning::Hay anios sin feriados cargados. Revisar scripts/feriados_chile.json"
          fi

      - name: Commit y push de los cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html data
          git diff --staged --quiet || git commit -m "Actualiza portafolio $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
