name: Exportar Asana cada hora
on:
  schedule:
    - cron: "0 13 * * 1-4"
    - cron: "0 20 * * 1-4"
    - cron: "0 13 * * 5"
    - cron: "0 16 * * 5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install playwright openpyxl
          playwright install chromium --with-deps

      - name: Restaurar sesion de Asana
        env:
          ASANA_AUTH: ${{ secrets.ASANA_AUTH }}
        run: echo "$ASANA_AUTH" | base64 -d > auth.json

      - name: Limpiar carpeta data
        run: rm -f data/*.xlsx data/*.csv

      - name: Exportar proyectos
        run: python scripts/asana_export.py

      - name: Subir diagnostico si hubo fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Borrar sesion
        if: always()
        run: rm -f auth.json

      - name: Generar KPI.HTML
        run: python scripts/generar_kpi.py data KPI.HTML

      - name: Generar CURVAS.HTML
        run: python scripts/generar_curvaS.py data CURVAS.HTML

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ KPI.HTML CURVAS.HTML
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizacion automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git reset --soft origin/main
          git add -f data/ KPI.HTML CURVAS.HTML
          git diff --staged --quiet && echo "Sin cambios tras fetch" && exit 0
          git commit -m "Actualizacion automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
